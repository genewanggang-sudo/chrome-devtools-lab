# DSH bundle patch for chrome-devtools-lab.
#
# Registers the Chrome DevTools MCP server that this repository ships, mirroring
# `.mcp.json` (Codex) and the inline `mcpServers` block in
# `.zcode-plugin/plugin.json` (ZCode): same wrapper script, endpoint, and flags.
#
# DSH loads a bundle from the profile's `node_modules`, so a relative `cwd: .`
# would resolve against the Harness process instead of this package. Both paths
# are therefore derived from the Loader's profile base URL at activation time:
# `<profile>/node_modules/chrome-devtools-lab`. Keep the package name aligned
# with `package.json`; an aliased install needs this expression adjusted.
#
# The server attaches to a Chrome instance that is already listening on the CDP
# endpoint, so start one first:
#
#   node scripts/cdp.mjs start
#
# Tool names surface as mcp__chrome__<tool>. Keep this file in sync with
# `.mcp.json` when the MCP arguments change, and bump `version` in
# `package.json` and both host manifests together.
- insert:
    - id: chrome-devtools-mcp
      name: '@deepseek-ai/dsh-mcp-client'
      config:
        serverName: chrome
        transport: stdio
        command: node
        cwd: !!js decodeURIComponent(new URL('node_modules/chrome-devtools-lab', ctx.baseUrl).pathname).replace(/^\/([A-Za-z]:)/, '$1')
        args:
          - !!js decodeURIComponent(new URL('node_modules/chrome-devtools-lab/scripts/devtools-mcp.mjs', ctx.baseUrl).pathname).replace(/^\/([A-Za-z]:)/, '$1')
          - '--browserUrl'
          - 'http://127.0.0.1:9333'
          - '--pageIdRouting'
          - '--experimentalDevtools'
          - '--experimentalStructuredContent'
          - '--no-category-memory'
          - '--no-usage-statistics'
          - '--no-performance-crux'
          - '--redactNetworkHeaders'
        env:
          CHROME_DEVTOOLS_MCP_NO_USAGE_STATISTICS: '1'
        failOnStartupError: false
